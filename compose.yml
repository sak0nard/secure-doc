services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: secure_doc_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:-owner_local_only}
      POSTGRES_DB: secure_doc
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_local_only}
    ports:
      - '${PG_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U secure_doc_owner -d secure_doc']
      interval: 2s
      timeout: 3s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfs_local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfs_local_secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfsdata:/data

  # One-off job: creates the app and test buckets, then exits 0. Safe to re-run.
  # Bun's S3 client cannot create buckets, so the app expects them to exist.
  createbuckets:
    image: amazon/aws-cli:2.27.0
    depends_on:
      - rustfs
    restart: 'no'
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfs_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfs_local_secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-ap-southeast-2}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        s3="aws --endpoint-url http://rustfs:9000"
        for i in $$(seq 30); do $$s3 s3 ls > /dev/null 2>&1 && break; sleep 1; done
        for b in secure-doc secure-doc-test; do
          $$s3 s3api head-bucket --bucket $$b 2> /dev/null || $$s3 s3 mb s3://$$b || exit 1
        done

volumes:
  pgdata:
  rustfsdata:
